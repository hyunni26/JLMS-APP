{% extends "base.html" %}
{% block content %}
<div class="breadcrumb"><a href="{{ url_for('dashboard') }}">← 목록</a></div>
<h1>거래처 원장</h1>

<div class="card">
  <form method="get">
    <select name="company_id" required style="width:100%; margin-bottom:10px;">
      <option value="" disabled selected>거래처를 선택하세요</option>
      {% for c in companies %}
      <option value="{{ c.id }}">{{ c.name }}</option>
      {% endfor %}
    </select>
    <button type="submit" class="btn gold" style="width:100%;">조회</button>
  </form>
</div>
{% endblock %}
