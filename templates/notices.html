{% extends "base.html" %}
{% block content %}
<div class="breadcrumb"><a href="{{ url_for('dashboard') }}">← 목록</a></div>
<h1>공지사항</h1>

{% if not notices %}
<div class="card empty">공지사항이 없습니다.</div>
{% endif %}
{% for n in notices %}
<div class="card">
  <h2>{{ n.title }}</h2>
  <div class="sync-info">{{ n.author or '관리자' }} · {{ n.created_at }}</div>
  <div class="content-box" style="margin-top:8px;">{{ n.content }}</div>
</div>
{% endfor %}
{% endblock %}
