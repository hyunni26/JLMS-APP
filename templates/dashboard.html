{% extends "base.html" %}
{% block content %}
<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
    <div style="font-size:13px; color:var(--text-light); font-weight:600;">DB별 마지막 동기화</div>
    <form method="post" action="{{ url_for('sync_db') }}" id="syncForm" onsubmit="return startSync()">
      <button type="submit" class="btn" id="syncBtn">지금 새로고침</button>
    </form>
  </div>
  <table style="width:100%; font-size:13px;">
    {% for r in sync_rows %}
    <tr>
      <td style="padding:4px 0; color:var(--text-light);">{{ r.label }}</td>
      <td style="padding:4px 0; text-align:right; font-weight:600;">
        {{ r.synced or "아직 불러온 데이터 없음" }}
      </td>
    </tr>
    {% endfor %}
  </table>
</div>

<div id="syncOverlay" style="display:none; position:fixed; inset:0; background:rgba(27,42,74,0.55);
     z-index:999; align-items:center; justify-content:center; flex-direction:column; color:white;">
  <div style="width:34px; height:34px; border:4px solid rgba(255,255,255,0.35); border-top-color:#fff;
       border-radius:50%; animation:spin 0.8s linear infinite;"></div>
  <div style="margin-top:12px; font-weight:600; font-size:14px;">서버에서 최신 데이터(6개 파일) 불러오는 중...</div>
</div>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
<script>
function startSync() {
  document.getElementById('syncBtn').disabled = true;
  document.getElementById('syncBtn').textContent = '불러오는 중...';
  document.getElementById('syncOverlay').style.display = 'flex';
  return true;
}
</script>

<div class="menu-grid">
  <a class="menu-item" href="{{ url_for('notices') }}"><span class="icon">📢</span>공지사항</a>
  <a class="menu-item" href="{{ url_for('ledger_company_list') }}"><span class="icon">📒</span>거래처 원장</a>
  <a class="menu-item" href="{{ url_for('companies') }}"><span class="icon">🏢</span>거래처 관리</a>
  <a class="menu-item" href="{{ url_for('lens_types') }}"><span class="icon">🔎</span>렌즈 관리</a>
  <a class="menu-item" href="{{ url_for('night_work') }}"><span class="icon">🌙</span>RX 작업 현황</a>
  <a class="menu-item" href="{{ url_for('production') }}"><span class="icon">🏭</span>생산 작업 현황</a>
</div>
{% endblock %}
