{% extends "base.html" %}
{% block content %}
<div class="card" style="display:flex; justify-content:space-between; align-items:center;">
  <div>
    <div style="font-size:13px; color:var(--text-light);">마지막 동기화</div>
    <div style="font-weight:600;">{{ last_synced or "아직 불러온 데이터 없음" }}</div>
  </div>
  <form method="post" action="{{ url_for('sync_db') }}">
    <button type="submit" class="btn">지금 새로고침</button>
  </form>
</div>

<div class="menu-grid">
  <a class="menu-item" href="{{ url_for('notices') }}"><span class="icon">📢</span>공지사항</a>
  <a class="menu-item" href="{{ url_for('ledger_company_list') }}"><span class="icon">📒</span>거래처 원장</a>
  <a class="menu-item" href="{{ url_for('companies') }}"><span class="icon">🏢</span>거래처 관리</a>
  <a class="menu-item" href="{{ url_for('lens_types') }}"><span class="icon">🔎</span>렌즈 관리</a>
  <a class="menu-item" href="{{ url_for('night_work') }}"><span class="icon">🌙</span>RX 작업 현황</a>
  <a class="menu-item" href="{{ url_for('production') }}"><span class="icon">🏭</span>생산 작업 현황</a>
</div>
{% endblock %}
